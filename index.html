<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102f46"><meta name="description" content="《远洋货轮日志》——从甲板新人到船长，再到航运集团创建者的横屏航海人生模拟游戏。"><link rel="icon" href="assets/images/icon.png"><link rel="manifest" href="manifest.webmanifest"><title>远洋货轮日志 · ABC STUDIO</title><link rel="stylesheet" href="css/game.css"></head><body><noscript>本游戏需要启用 JavaScript。</noscript><div id="rotate-tip" role="status"><b>请横置手机</b><span>转动设备后继续航行</span></div><main id="app" aria-live="polite"><section id="title-screen" class="screen active" aria-label="开始页面"><img class="scene-image" src="assets/images/title-harbor-v2.png" alt="清晨的临岬港与等待离港的旧货轮"><div class="title-shade"></div><header class="game-title"><p>一生、一艘船、一张会记住你的海图</p><h1>远洋货轮日志</h1><small>从甲板新人到船长，再到一支船队的创建者</small></header><nav class="diegetic-menu" aria-label="主菜单"><button data-title-action="new" class="hotspot gangway"><span>登上舷梯</span><b>新航程</b></button> <button data-title-action="continue" class="hotspot bridge"><span>驾驶台仍亮着灯</span><b>继续</b></button> <button data-title-action="archive" class="hotspot chart"><span>摊开的旧海图</span><b>世界档案</b></button> <button data-title-action="achievements" class="hotspot log"><span>船长日志</span><b>成就与彩蛋</b></button> <button data-title-action="settings" class="hotspot radio"><span>无线电频道</span><b>设置</b></button></nav><div class="studio-mark">ABC STUDIO · 2026</div></section><section id="game-screen" class="screen" aria-label="游戏主界面"><header id="topbar"><button id="identity-button" aria-label="设计船队旗帜"><canvas id="identity-flag" width="36" height="24"></canvas></button><div class="identity"><b id="player-name">未登船</b><span id="career-title">甲板新人</span></div><div class="top-stat"><span>航海日</span><b id="day-value">1</b></div><div class="top-stat"><span>资金</span><b id="money-value">¥2,400</b></div><div class="top-stat"><span>船况</span><b id="ship-value">86%</b></div><div class="top- tion><section id="career-view" class="view panel-view" aria-label="生涯与企业"><header><h2>生涯与企业</h2><p id="career-summary"></p></header><div id="career-track"></div><div id="charter-panel"></div><div id="fleet-panel"></div></section></div><nav id="dock-nav" aria-label="游戏功能"><button data-view="ship"><span>⚓</span>船上</button> <button data-view="map"><span>⌖</span>海图</button> <button data-view="port"><span>▦</span>港口</button> <button data-view="crew"><span>♟</span>船员</button> <button data-view="journal"><span>▤</span>日志</button> <button data-view="career"><span>♜</span>生涯</button> <button id="menu-button"><span>☰</span>菜单</button></nav><button id="companies-button" hidden>同行公司</button><button id="loan-button" hidden>港口账房</button></section></main><div id="modal-layer" aria-live="assertive"></div><div id="toast-layer" aria-live="polite"></div><label class="import-label" for="import-save">导入档案</label><input id="import-save" type="file" accept="application/json,.json" hidden><template id="modal-template"><section class="modal" role="dialog" aria-modal="true"><div class="modal-frame"><header><h2></h2><button class="modal-close" aria-label="关闭">×</button></header><div class="modal-body"></div><footer class="modal-actions"></footer></div></section></template><script src="js/data.js"></script><script src="js/world.js"></script><script src="js/game.js"></script><script src="js/scenes.js"></script></body></html>
